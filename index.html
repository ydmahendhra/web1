    <script>
      // Gracefully suppress Vite HMR WebSocket errors per environment constraints (HMR is disabled in AI Studio)
      window.addEventListener('unhandledrejection', function (event) {
        var reason = event && event.reason;
        var msg = (reason && (reason.stack || reason.message || String(reason))) || '';
        if (typeof msg === 'string' && (msg.includes('WebSocket') || msg.includes('vite') || msg.includes('createWebSocketModuleRunnerTransport'))) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      }, true);
      window.addEventListener('error', function (event) {
        var err = event && (event.error || event.message);
        var msg = (err && (err.stack || err.message || String(err))) || '';
        var filename = (event && event.filename) || '';
        if ((typeof msg === 'string' && (msg.includes('WebSocket') || msg.includes('vite') || msg.includes('createWebSocketModuleRunnerTransport'))) || filename.includes('@vite/client')) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      }, true);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
